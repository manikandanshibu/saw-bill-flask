{% extends "base.html" %}

{% block content %}
<div class="splash-container">
    <div class="splash-logo">
        <h1 class="logo-text">PLATHOTTATHIL TMPER'S & Saw Mill</h1>
        <div class="loading-bar"></div>
    </div>
</div>

<style>
    .splash-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        animation: fadeOut 0.5s ease-in-out 2s forwards;
    }

    .splash-logo {
        text-align: center;
        animation: scaleUp 0.5s ease-in-out;
    }

    .logo-text {
        font-size: 3rem;
        font-weight: bold;
        color: #007bff;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 2px;
    }

    .loading-bar {
        width: 200px;
        height: 4px;
        background: #f0f0f0;
        border-radius: 2px;
        overflow: hidden;
        position: relative;
    }

    .loading-bar::after {
        content: '';
        position: absolute;
        left: -50%;
        width: 50%;
        height: 100%;
        background: #007bff;
        animation: loading 1s ease-in-out infinite;
    }

    @keyframes scaleUp {
        from {
            transform: scale(0.5);
            opacity: 0;
        }
        to {
            transform: scale(1);
            opacity: 1;
        }
    }

    @keyframes fadeOut {
        to {
            opacity: 0;
            visibility: hidden;
        }
    }

    @keyframes loading {
        0% {
            left: -50%;
        }
        100% {
            left: 100%;
        }
    }
</style>

<script>
    setTimeout(function() {
        window.location.href = "{{ url_for('menu') }}";
    }, 2500);
</script>
{% endblock %}
